apiVersion: apps/v1
kind: Deployment

metadata:
  name: inference-consumer

spec:
  replicas: 1

  selector:
    matchLabels:
      app: inference-consumer

  template:
    metadata:
      labels:
        app: inference-consumer

    spec:
      containers:
      - name: inference-consumer

        image: kimmypeters/inference-consumer:latest

        env:
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"

        - name: S3_BUCKET
          value: "async-ai-inference-bucket"

        - name: SQS_QUEUE_URL
          value: "https://sqs.us-east-1.amazonaws.com/330117118623/async-ai-inference-queue"

          
          
        volumeMounts:
        - name: aws-credentials
          mountPath: /root/.aws
          readOnly: true

      volumes:
      - name: aws-credentials
        secret:
          secretName: aws-credentials  